[project]
name = "hcm-lite-ai-service"
version = "0.1.0"
description = "HCM Lite: minimal HR backend + AI Assistant (M8)"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "bcrypt>=5.0.0",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "openai-agents>=0.24.0",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.1",
    "pyjwt>=2.15.1",
    "sqlmodel>=0.0.48",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "pip-audit>=2.10.1",
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "-m 'not llm'"
markers = [
    "llm: tests that call the real LLM. Run only with `pytest -m llm` (never by default).",
]

[tool.ruff]
line-length = 100
target-version = "py313"
